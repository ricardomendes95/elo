[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/relay",
    "crates/session",
    "crates/client-core",
    "crates/client",
    "crates/gui",
    "crates/p2p",
    "crates/android",
]
# `cargo build`/`cargo test` with no target skip the GUI (it pulls a windowing
# stack); build it explicitly with `cargo run -p elo-gui`.
default-members = [
    "crates/protocol",
    "crates/relay",
    "crates/session",
    "crates/client-core",
    "crates/client",
]

[workspace.package]
version = "0.3.5"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.217", features = ["derive"] }
bincode = "1.3.3"
tokio = { version = "1.43.0", features = ["full"] }
anyhow = "1.0.95"
thiserror = "2.0.11"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
snow = "0.9.6"
flate2 = "1.0.35"
sha2 = "0.10.8"
rand = "0.8.5"
