[package]
name = "elo-client-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Desktop defaults. The Android library (`elo-android`) turns both off: it uses the
# raw-media events (MediaCodec/AudioTrack/ClipboardManager on the Kotlin side).
default = ["clipboard", "h264"]
# Text clipboard sync through `arboard`.
clipboard = ["dep:arboard"]
# H.264 encode/decode through OpenH264 (built from source).
h264 = ["dep:openh264"]

[dependencies]
elo-protocol = { path = "../protocol" }
elo-session = { path = "../session" }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
serde_json = "1.0.133"
rand = { workspace = true }
# Enumerar interfaces de rede para o broadcast de descoberta sair por todas elas.
if-addrs = "0.13"
async-trait = "0.1.83"
# 2FA (TOTP, RFC 6238)
hmac = "0.13.0"
sha1 = "0.11.0"
data-encoding = "2.11.1"
# Text clipboard sync
arboard = { version = "3.7.0", optional = true }
# H.264 video codec (built from source)
openh264 = { version = "0.9.10", optional = true }

[target.'cfg(windows)'.dependencies]
# System audio loopback capture + playback (WASAPI)
cpal = "0.18.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_StationsAndDesktops",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
]

[dev-dependencies]
tokio = { workspace = true }
elo-relay = { path = "../relay" }
