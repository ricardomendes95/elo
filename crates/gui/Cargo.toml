[package]
name = "elo-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "elo"
path = "src/main.rs"

[dependencies]
elo-protocol = { path = "../protocol" }
elo-session = { path = "../session" }
elo-client-core = { path = "../client-core" }
elo-p2p = { path = "../p2p" }
tokio = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.133"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
qrcode = { version = "0.15.0", default-features = false }
eframe = "0.29.1"
egui = "0.29.1"
# Seletor de arquivo nativo (usado no envio host → controlador). No Windows usa
# o diálogo Win32; no Linux (apenas para `cargo check`) usa o portal XDG, sem
# exigir GTK no sistema.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7.0"
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
ico = "0.3.0"
winresource = "0.1.17"
